name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - run: npm ci

      - name: Verify
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build

      # npm trusted publishing via GitHub Actions OIDC — no token needed.
      # Prerequisites (one-time, on npmjs.com):
      #   Settings → Publishing → Trusted Publisher
      #   repository: aispin/vue-easy-gantt, workflow file: publish.yml
      # Requires npm >= 11.5.1 (bundled npm may be older, so upgrade first).
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Publish
        run: npm publish --provenance --access public
